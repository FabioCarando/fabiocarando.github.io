<svg width="1000" height="570"
     viewBox="0 0 1000 570"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .bg { fill: #0d1117; }
  .border { fill: none; stroke: #30363d; stroke-width: 1; }
  .divider { stroke: #21262d; stroke-width: 1; }

  .index {
    font: 12px monospace;
    fill: #484f58;
    letter-spacing: 2px;
  }

  .section {
    font: 700 13px monospace;
    fill: #8b949e;
    letter-spacing: 3px;
  }

  .project {
    font: 700 23px monospace;
    fill: #ffffff;
    letter-spacing: 1px;
  }

  .tagline {
    font: 14px monospace;
    fill: #c9d1d9;
  }

  .description {
    font: 13px monospace;
    fill: #8b949e;
  }

  .stack {
    font: 12px monospace;
    fill: #6e7681;
  }

  .open {
    font: 700 12px monospace;
    fill: #ffffff;
    letter-spacing: 1px;
  }

  .status {
    font: 11px monospace;
    fill: #3fb950;
  }

  .dot {
    fill: #3fb950;
  }
</style>

