
<svg width="1000" height="440"
     viewBox="0 0 1000 440"
     xmlns="http://www.w3.org/2000/svg">

<style>

.background {
    fill: #0d1117;
}

.border {
    fill: none;
    stroke: #30363d;
    stroke-width: 1;
}

.title {
    font: 700 18px monospace;
    fill: #ffffff;
    letter-spacing: 3px;
}

.online {
    font: 13px monospace;
    fill: #3fb950;
}

.section {
    font: 700 12px monospace;
    fill: #8b949e;
    letter-spacing: 2px;
}

.label {
    font: 14px monospace;
    fill: #8b949e;
}

.value {
    font: 14px monospace;
    fill: #ffffff;
}

.dim {
    font: 12px monospace;
    fill: #484f58;
}

.pulse {
    fill: #3fb950;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%   { opacity: 1; }
    50%  { opacity: .25; }
    100% { opacity: 1; }
}

</style>

<rect width="100%" height="100%" rx="14" class="background"/>

<rect
    x="1"
    y="1"
    width="998"
    height="438"
    rx="14"
    class="border"
/>

<!-- HEADER -->

<text x="45" y="55" class="title">
FABIO OS
</text>

<circle cx="835" cy="49" r="5" class="pulse"/>

<text x="850" y="54" class="online">
ONLINE
</text>

<line
    x1="45"
    y1="80"
    x2="955"
    y2="80"
    stroke="#30363d"
/>

<!-- SYSTEM -->

<text x="45" y="120" class="section">
SYSTEM
</text>

<text x="45" y="155" class="label">
ROLE
</text>

<text x="220" y="155" class="value">
Data Scientist
</text>

<text x="45" y="185" class="label">
