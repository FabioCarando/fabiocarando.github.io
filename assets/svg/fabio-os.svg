</text>

<text x="220" y="185" class="value">
AI · Automation · Data Products
</text>

<text x="45" y="215" class="label">
MODE
</text>

<text x="220" y="215" class="value">
BUILDING
</text>

<!-- GITHUB LIVE -->

<text x="530" y="120" class="section">
GITHUB / LIVE
</text>

<text x="530" y="155" class="label">
